<body>


<header class="container">
<div>
<h1 class="col-lg-6 col-md-6 col-sm-6 container">CRUDS</h1>
<h3 class="col-lg-10 col-md-10 col-sm-10 container"><SPAN class="me-2">CREAT</SPAN><SPAN class="me-2">READ</SPAN><SPAN class="me-2">UPDATE</SPAN><SPAN class="me-2">DELET</SPAN><SPAN>SEARCH</SPAN></h3>

<main class="input container">

<div class="the_title ">
<input class="Title col-sm-10 col-lg-10 col-md-10" type="text" placeholder="Title">
</div>

<div class=" the_price">

<input onkeyup="Get_total()"  type="number" class="Price col-lg-2 col-md-2 col-sm-2 " placeholder="Price">
<input onkeyup="Get_total()"  type="number" class="taxses col-lg-2 col-md-2 col-sm-2 " placeholder="taxses">
<input onkeyup="Get_total()"  type="number" class="Ads col-lg-2 col-md-2 col-sm-2 " placeholder="Ads">
<input onkeyup="Get_total()"  type="number" class="Discount col-lg-2 col-md-2 col-sm-2 " placeholder="Discount">

<small class=" the_total">Total : <span class="Total_number">100</span></small>
</div>

<div class="the_count">
    <input type="number" placeholder="count" class="count container col-sm-10 col-lg-10 col-md-10">
</div>

<div class="the_category">
    <input type="text" placeholder="category" class="category container col-sm-10 col-lg-10 col-md-10">
</div>

<div class="the_creat">
<button class="Creat  container col-sm-10 col-lg-10 col-md-10">Creat</button>
<button class="update  container col-sm-10 col-lg-10 col-md-10">update</button>

</div>

<div class="the_search">
<input onkeyup="getSerch(this.value)"  type="text" placeholder="Search" class="Search container col-sm-10 col-lg-10 col-md-10" >
</div>

<div class="secrching_type">

    <button onclick="GivId(this.id)" id="Search_by_Title"     class="  me-4 container col-sm-4 col-lg-4 col-md-4">Search<span> By </span>Title</button>
    <button onclick="GivId(this.id)" id="Search_by_Category"  class= " ms-4  container col-sm-4 col-lg-4 col-md-4">Search<span> By </span>Category</button>
</div>

</main>  
<footer class="output container">

<div class="the_delet">
<button class="Delet container col-sm-10 col-lg-10 col-md-10">Delet_All</button>
</div>

<div class="table container">
